name: Check Blinkit Stock

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Enables running manually from the GitHub UI

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browser & OS Deps
      run: |
        python -m playwright install chromium --with-deps

    - name: Run Stock Checker Bot
      env:
        FIREBASE_PROJECT_ID: blinkit-stock-bot-2026
        # Read the Firebase Service Account JSON string from GitHub Secrets
        FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      run: python main.py

